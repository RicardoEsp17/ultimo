<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gasolineras Espana</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="title-wrap">
        <span class="title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 3.5h6.2c1.4 0 2.5 1.1 2.5 2.5v12.4c0 1.2-1 2.1-2.1 2.1H6.4c-1.2 0-2.1-1-2.1-2.1V6c0-1.4 1.1-2.5 2.5-2.5Z" stroke="currentColor" stroke-width="1.7"/>
            <path d="M7.1 7.2h5.9M9 10.3h2.4M15.7 8.6h1.3c1.4 0 2.5 1.1 2.5 2.5v3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M18.4 20.5a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z" fill="currentColor"/>
          </svg>
        </span>
        <h1>Precios carburantes en Espana</h1>
      </div>
    </header>

    <section class="fuel-grid" aria-label="Precios medios nacionales">
      <article class="fuel-card">
        <button class="fuel-button btn-gas95 active" type="button" data-fuel="gas95">Gas 95</button>
        <div class="fuel-summary">Precio medio nacional: <strong id="avg-gas95">--</strong> <span>€/L</span></div>
        <div class="fuel-bar" id="bar-gas95"></div>
        <div class="fuel-breakdown" id="breakdown-gas95"></div>
      </article>
      <article class="fuel-card">
        <button class="fuel-button btn-diesel" type="button" data-fuel="diesel">Diesel</button>
        <div class="fuel-summary">Precio medio nacional: <strong id="avg-diesel">--</strong> <span>€/L</span></div>
        <div class="fuel-bar" id="bar-diesel"></div>
        <div class="fuel-breakdown" id="breakdown-diesel"></div>
      </article>
      <article class="fuel-card">
        <button class="fuel-button btn-diesel-plus" type="button" data-fuel="dieselPlus">Diesel +</button>
        <div class="fuel-summary">Precio medio nacional: <strong id="avg-dieselPlus">--</strong> <span>€/L</span></div>
        <div class="fuel-bar" id="bar-dieselPlus"></div>
        <div class="fuel-breakdown" id="breakdown-dieselPlus"></div>
      </article>
    </section>

    <main class="main-grid">
      <section class="map-panel">
        <div id="map"></div>
      </section>

      <aside class="side-panel">
        <form class="search-box" id="searchForm">
          <input id="searchInput" type="search" placeholder="Buscar ciudad, calle o codigo postal" autocomplete="off">
          <button type="submit">Buscar</button>
        </form>
        <div class="station-list" id="stationList"></div>
      </aside>
    </main>

    <section class="chart-panel">
      <div class="chart-head">
        <div>
          <h2>Evolucion de 30 dias</h2>
          <p id="chartSubtitle">Eje izquierdo en €/L y eje derecho en $ por barril</p>
        </div>
        <div class="legend">
          <span><i style="background:#334155"></i>Brent</span>
          <span><i style="background:#16a34a"></i>Gas 95</span>
          <span><i style="background:#f59e0b"></i>Diesel</span>
          <span><i style="background:#dc2626"></i>Diesel +</span>
        </div>
      </div>
      <div class="chart-plot" id="chartPlot">
        <svg id="historyChart" aria-label="Historico de precios"></svg>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
